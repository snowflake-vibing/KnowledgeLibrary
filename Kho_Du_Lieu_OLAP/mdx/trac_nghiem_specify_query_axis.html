<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Trắc nghiệm MDX: Specify the Contents of a Query Axis</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--gray-800);
            line-height: 1.6;
            padding: 24px 16px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 32px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .badge-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 13px;
            backdrop-filter: blur(4px);
        }

        /* Control Panel */
        .controls {
            background: white;
            padding: 20px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 12px;
            z-index: 100;
        }

        .score-box {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-700);
        }

        .score-value {
            color: var(--primary);
            font-size: 22px;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--gray-200);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background-color: var(--gray-300);
        }

        /* Question Cards */
        .question-card {
            background: white;
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary);
            transition: all 0.2s ease;
        }

        .question-card.answered-correct {
            border-left-color: var(--success);
        }

        .question-card.answered-incorrect {
            border-left-color: var(--danger);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .q-number {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .q-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .q-code {
            background: #1e293b;
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: Consolas, Monaco, "Courier New", monospace;
            font-size: 13.5px;
            margin: 10px 0 16px 0;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .option-item:hover {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--primary);
            cursor: pointer;
            width: 17px;
            height: 17px;
        }

        .option-text {
            font-size: 14.5px;
            color: var(--gray-800);
            flex: 1;
        }

        .option-text code {
            background: var(--gray-100);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #c026d3;
        }

        /* Checked & Feedback States */
        .option-item.selected {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .option-item.correct-ans {
            background-color: var(--success-light) !important;
            border-color: var(--success) !important;
            font-weight: 600;
            color: #065f46;
        }

        .option-item.wrong-ans {
            background-color: var(--danger-light) !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        /* Explanation Box */
        .explanation {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            background-color: #f8fafc;
            border: 1px solid var(--gray-200);
            display: none;
            font-size: 14px;
            line-height: 1.5;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation strong {
            color: var(--gray-900);
        }

        .explanation .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .explanation .tag.correct {
            background: var(--success-light);
            color: #065f46;
        }

        .explanation .tag.incorrect {
            background: var(--danger-light);
            color: #991b1b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Result Summary Modal */
        #summaryCard {
            display: none;
            background: white;
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            text-align: center;
            margin-bottom: 24px;
            border: 2px solid var(--primary);
        }

        #summaryCard h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--gray-900);
        }

        #summaryScore {
            font-size: 40px;
            font-weight: 800;
            color: var(--primary);
            margin: 12px 0;
        }

        #summaryMsg {
            font-size: 15px;
            color: var(--gray-600);
            margin-bottom: 20px;
        }
    </style>
</head>

        <div class="badge-bar">

<script>
const quizData = [
    {
        id: 1,
        question: "Trong ngôn ngữ Multidimensional Expressions (MDX), các trục truy vấn (Query Axes) đóng vai trò gì đối với tập kết quả?",
        options: [
            "Xác định các điều kiện lọc ẩn trên khối dữ liệu (Cube).",
            "Xác định các cạnh (edges) của tập ô kết quả (Cellset) được hiển thị trên client.",
            "Tự động tính toán lại các bảng vật lý trong cơ sở dữ liệu quan hệ nguồn.",
            "Đóng vai trò là các khóa chính (Primary Key) trong mô hình dữ liệu quan hệ."
        ],
        correct: 1,
        explanation: "Theo tài liệu Microsoft Learn: Query axes specify the edges of a cellset returned by a SELECT statement, cho phép kiểm soát và hiển thị trực tiếp dữ liệu dạng dòng, cột, trang... trả về cho client."
    },
    {
        id: 2,
        question: "Cú pháp chuẩn của mệnh đề đặc tả trục truy vấn (<SELECT query axis clause>) trong MDX là gì?",
        options: [
            "[ NON EMPTY ] Set_Expression [ <SELECT dimension property list clause> ] [ <HAVING clause> ] ON { Axis_Specification }",
            "WHERE ( Tuple_Expression ) GROUP BY Dimension_Name",
            "AXIS(n) = Set_Expression HAVING Condition",
            "SELECT Set_Expression FROM Cube_Name FILTER BY Condition"
        ],
        correct: 0,
        explanation: "Cú pháp chuẩn xác: [ NON EMPTY ] Set_Expression [ <SELECT dimension property list clause> ] [ <HAVING clause> ] ON { Integer_Expression | AXIS( Integer_Expression ) | { COLUMNS | ROWS | PAGES | SECTIONS | CHAPTERS } }."
    },
    {
        id: 3,
        question: "Từ khóa NON EMPTY đặt trước Set_Expression trên trục truy vấn có tác dụng gì?",
        options: [
            "Báo lỗi nếu phát hiện có ô dữ liệu mang giá trị NULL trong khối Cube.",
            "Tự động gán giá trị 0 cho tất cả các ô dữ liệu bị rỗng.",
            "Tự động loại bỏ tất cả các Tuple (dòng hoặc cột) mà toàn bộ giá trị giao điểm của nó với các trục khác đều là giá trị rỗng (NULL).",
            "Tạo thêm một dòng tổng cộng (Grand Total) ở cuối bảng kết quả."
        ],
        correct: 2,
        explanation: "Từ khóa NON EMPTY loại bỏ các tuple (hàng/cột) trên trục mà tất cả các ô tương ứng giao với các trục còn lại đều là rỗng (NULL / Empty cells)."
    },
    {
        id: 4,
        question: "Ngôn ngữ MDX hỗ trợ tối đa bao nhiêu trục truy vấn (Query Axes) trong một câu lệnh SELECT?",
        options: [
            "Tối đa 2 trục (COLUMNS và ROWS).",
            "Tối đa 5 trục (COLUMNS, ROWS, PAGES, SECTIONS, CHAPTERS).",
            "Tối đa 128 trục (từ trục 0 đến trục 127).",
            "Không giới hạn số lượng trục."
        ],
        correct: 2,
        explanation: "MDX cho phép đặc tả lên đến 128 trục truy vấn được đánh số từ 0 đến 127, dù trong thực tế các ứng dụng báo cáo phổ biến chỉ dùng 0, 1 hoặc 2 trục."
    },
    {
        id: 5,
        question: "Trục số 0 (AXIS(0)) trong câu truy vấn MDX có tên định danh chuẩn (Alias) là gì?",
        options: [
            "ROWS",
            "COLUMNS",
            "PAGES",
            "SECTIONS"
        ],
        correct: 1,
        explanation: "Trục số 0 (X-axis) có alias định danh là COLUMNS."
    },
    {
        id: 6,
        question: "Trục số 1 (AXIS(1)) trong câu truy vấn MDX có tên định danh chuẩn (Alias) là gì?",
        options: [
            "COLUMNS",
            "ROWS",
            "PAGES",
            "CHAPTERS"
        ],
        correct: 1,
        explanation: "Trục số 1 (Y-axis) có alias định danh chuẩn là ROWS."
    },
    {
        id: 7,
        question: "Năm trục đầu tiên (từ trục 0 đến trục 4) trong MDX lần lượt có các tên alias định danh chuẩn nào?",
        options: [
            "COLUMNS, ROWS, PAGES, SECTIONS, CHAPTERS",
            "ROWS, COLUMNS, PAGES, CHAPTERS, SECTIONS",
            "AXIS(1), AXIS(2), AXIS(3), AXIS(4), AXIS(5)",
            "X, Y, Z, W, V"
        ],
        correct: 0,
        explanation: "Thứ tự 5 alias chuẩn cho 5 trục đầu tiên: 0 = COLUMNS, 1 = ROWS, 2 = PAGES, 3 = SECTIONS, 4 = CHAPTERS."
    },
    {
        id: 8,
        question: "Quy tắc 'No Skipped Axes' (Không được nhảy cóc trục) trong MDX yêu cầu điều gì?",
        options: [
            "Không được để trống bất kỳ ô dữ liệu nào trong bảng.",
            "Không thể sử dụng một trục số cao hơn nếu chưa khai báo đầy đủ các trục số thấp hơn bắt đầu từ trục 0.",
            "Không được phép khai báo trục mang số lẻ.",
            "Phải luôn khai báo đủ cả 128 trục trong câu lệnh."
        ],
        correct: 1,
        explanation: "An MDX query cannot skip query axes. Bạn không thể sử dụng ROWS (trục 1) hoặc PAGES (trục 2) mà không khai báo COLUMNS (trục 0)."
    },
    {
        id: 9,
        question: "Xét câu truy vấn sau: \nSELECT [Product].[Category].Members ON ROWS FROM [Adventure Works]; \nCâu truy vấn này có hợp lệ không, và vì sao?",
        code: "SELECT \n    [Product].[Category].Members ON ROWS \nFROM [Adventure Works];",
        options: [
            "Hợp lệ, MDX cho phép tùy chọn bất kỳ trục nào để hiển thị.",
            "Không hợp lệ, vì vi phạm quy tắc 'No Skipped Axes' khi dùng trục 1 (ROWS) mà chưa có trục 0 (COLUMNS).",
            "Hợp lệ, vì mệnh đề FROM đã chỉ định đúng khối Adventure Works.",
            "Không hợp lệ, vì bắt buộc phải có mệnh đề WHERE."
        ],
        correct: 1,
        explanation: "Lỗi parser: Axis numbers specified in a query must be contiguous starting from 0. Nếu chỉ có 1 trục thì bắt buộc trục đó phải là COLUMNS (trục 0)."
    },
    {
        id: 10,
        question: "Nếu câu lệnh MDX có mệnh đề SELECT hoàn toàn không khai báo bất kỳ Query Axis nào (Empty SELECT Clause) như bên dưới, kết quả trả về là gì?",
        code: "SELECT \nFROM [Adventure Works] \nWHERE ([Measures].[Internet Sales Amount], [Date].[Calendar Year].[CY 2023]);",
        options: [
            "Báo lỗi cú pháp vì SELECT bắt buộc phải có ít nhất 1 trục.",
            "Trả về toàn bộ dữ liệu của tất cả các bảng trong Cube.",
            "Trả về tập ô gồm đúng 1 ô duy nhất (Single Cell) và tất cả các chiều đóng vai trò là Slicer Dimensions.",
            "Trả về kết quả rỗng (Empty resultset)."
        ],
        correct: 2,
        explanation: "MDX cho phép SELECT rỗng không trục. Lúc này toàn bộ các chiều hoạt động như chiều cắt lát (Slicer dimensions) và trả về một tập ô chỉ chứa đúng 1 giá trị duy nhất (Single cell)."
    },
    {
        id: 11,
        question: "Mệnh đề HAVING trong cú pháp định nghĩa Query Axis được đặt ở vị trí nào và có tác dụng gì?",
        options: [
            "Đặt trước từ khóa SELECT để gom nhóm các bảng lại.",
            "Đặt ngay sau Set_Expression trước từ khóa ON, dùng để lọc các thành viên trên trục theo điều kiện độ đo.",
            "Đặt trong mệnh đề FROM để lọc các Cube phụ.",
            "Hoàn toàn giống hàm GROUP BY HAVING của SQL về mặt cơ chế."
        ],
        correct: 1,
        explanation: "Mệnh đề HAVING đặt trực tiếp sau Set_Expression: [Set_Expression] HAVING [Condition] ON [Axis], dùng để lọc các thành viên trực tiếp trên trục theo điều kiện logic hoặc độ đo."
    },
    {
        id: 12,
        question: "Điểm khác biệt giữa việc dùng mệnh đề HAVING trên trục và dùng hàm FILTER(...) trong Set_Expression là gì?",
        options: [
            "HAVING chỉ dùng được với chuỗi ký tự, còn FILTER chỉ dùng với số.",
            "HAVING là một mệnh đề lọc cấp trục được đặt ngay trước ON, còn FILTER là một hàm nhận Set và biểu thức logic trả về Set mới.",
            "HAVING chỉ lọc được dòng (ROWS), không lọc được cột (COLUMNS).",
            "Hai cú pháp này là từ đồng nghĩa và có thể tráo đổi bất kỳ chỗ nào."
        ],
        correct: 1,
        explanation: "HAVING là mệnh đề tùy chọn tích hợp trong cú pháp trục (<HAVING clause>), trong khi FILTER() là một hàm MDX độc lập nhận đầu vào là Set và biểu thức điều kiện để trả về một Set được lọc."
    },
    {
        id: 13,
        question: "Mệnh đề DIMENSION PROPERTIES trên Query Axis được dùng nhằm mục đích gì?",
        options: [
            "Tạo thêm cột khóa ngoại mới cho chiều trong cơ sở dữ liệu quan hệ.",
            "Truy xuất thêm các thuộc tính mở rộng của các thành viên trên trục (như MEMBER_UNIQUE_NAME, FORMATTED_VALUE, LEVEL_NUMBER).",
            "Thay đổi kiểu dữ liệu của các độ đo trong khối Cube.",
            "Bắt buộc Analysis Services phải sắp xếp lại thứ tự các phần tử trên trục."
        ],
        correct: 1,
        explanation: "DIMENSION PROPERTIES cho phép ứng dụng client yêu cầu server trả về các thông tin metadata/thuộc tính mở rộng của Member (ví dụ: Caption, Level, Unique Name, Format string...)."
    },
    {
        id: 14,
        question: "Khi muốn kết hợp 2 chiều khác nhau (ví dụ: Danh mục sản phẩm và Quốc gia) cùng hiển thị trên trục ROWS, ta sử dụng kỹ thuật nào sau đây?",
        code: "SELECT \n    { [Measures].[Internet Sales Amount] } ON COLUMNS,\n    NON EMPTY CROSSJOIN(\n        [Product].[Category].Members,\n        [Customer].[Country].Members\n    ) ON ROWS \nFROM [Adventure Works];",
        options: [
            "Dùng từ khóa UNION ALL.",
            "Dùng hàm CROSSJOIN (hoặc toán tử *) để tạo tập hợp các Tuple đa chiều gồm 2 thành viên.",
            "Dùng mệnh đề INNER JOIN.",
            "Không thể kết hợp nhiều chiều trên cùng một trục trong MDX."
        ],
        correct: 1,
        explanation: "Hàm CROSSJOIN(Set1, Set2) kết hợp tích Descartes giữa 2 tập hợp để sinh ra tập hợp gồm các Tuple 2 chiều trên cùng một trục."
    },
    {
        id: 15,
        question: "Phát biểu nào sau đây phân biệt ĐÚNG NHẤT giữa Query Axis (SELECT) và Slicer Axis (WHERE)?",
        options: [
            "Query Axis định hình các chiều hiển thị trên lưới kết quả, còn Slicer Axis lọc dữ liệu ngầm định và không xuất hiện trên tiêu đề kết quả.",
            "Query Axis nhận một Tuple đơn lẻ, còn Slicer Axis nhận một Set đa phần tử.",

let userAnswers = {};
let isSubmitted = false;

function renderQuiz() {
    const container = document.getElementById("quizContainer");
    container.innerHTML = "";

    quizData.forEach((q, idx) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `qCard_${q.id}`;

        let codeHtml = q.code ? `<div class="q-code">${escapeHtml(q.code)}</div>` : "";

        let optionsHtml = q.options.map((opt, oIdx) => {
            return `
                <label class="option-item" id="optLabel_${q.id}_${oIdx}">
                    <input type="radio" name="question_${q.id}" value="${oIdx}" onchange="selectOption(${q.id}, ${oIdx})">
                    <span class="option-text">${opt}</span>
                </label>
            `;
        }).join("");

        card.innerHTML = `
            <div class="q-header">
                <span class="q-number">Câu hỏi ${q.id} / ${quizData.length}</span>
            </div>
            <div class="q-title">${q.question}</div>
            ${codeHtml}
            <div class="options-list">
                ${optionsHtml}
            </div>
            <div class="explanation" id="exp_${q.id}">
                <div class="tag" id="expTag_${q.id}"></div>
                <div><strong>Giải thích:</strong> ${q.explanation}</div>
            </div>
        `;

        container.appendChild(card);
    });
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function selectOption(qId, oIdx) {
    if (isSubmitted) return;
    userAnswers[qId] = oIdx;

    // update style
    for (let i = 0; i < 4; i++) {
        const label = document.getElementById(`optLabel_${qId}_${i}`);
        if (label) {
            if (i === oIdx) {
                label.classList.add("selected");
            } else {
                label.classList.remove("selected");
            }
        }
    }

    updateAnsweredCount();
}

function updateAnsweredCount() {
    const count = Object.keys(userAnswers).length;
    document.getElementById("answeredCount").innerText = count;
}

function submitQuiz() {
    if (isSubmitted) return;

    let score = 0;
    quizData.forEach(q => {
        const selected = userAnswers[q.id];
        const card = document.getElementById(`qCard_${q.id}`);
        const expBox = document.getElementById(`exp_${q.id}`);
        const expTag = document.getElementById(`expTag_${q.id}`);

        // highlight correct answer
        const correctLabel = document.getElementById(`optLabel_${q.id}_${q.correct}`);
        if (correctLabel) {
            correctLabel.classList.add("correct-ans");
        }

        if (selected === q.correct) {
            score++;
            card.classList.add("answered-correct");
            expTag.className = "tag correct";
            expTag.innerText = "✓ Bạn đã trả lời đúng!";
        } else {
            card.classList.add("answered-incorrect");
            expTag.className = "tag incorrect";
            if (selected !== undefined) {
                const wrongLabel = document.getElementById(`optLabel_${q.id}_${selected}`);
                if (wrongLabel) wrongLabel.classList.add("wrong-ans");
                expTag.innerText = "✗ Bạn đã chọn sai";
            } else {
                expTag.innerText = "Chưa trả lời";
            }
        }

        expBox.classList.add("show");
    });

    isSubmitted = true;

    // Update Score
    const percent = Math.round((score / quizData.length) * 100);
    document.getElementById("scoreDisplay").innerText = `${score} / ${quizData.length} (${percent}%)`;

    // Show summary card
    const summaryCard = document.getElementById("summaryCard");
    summaryCard.style.display = "block";
    document.getElementById("summaryScore").innerText = `${score} / ${quizData.length} điểm (${percent}%)`;

    let msg = "";
    if (percent >= 90) {
        msg = "🎉 Xuất sắc! Bạn đã nắm vững toàn bộ kiến thức về Query Axes trong MDX.";
    } else if (percent >= 70) {
        msg = "👍 Khá tốt! Bạn đã hiểu hầu hết các khái niệm cốt lõi, hãy xem lại các câu sai để củng cố.";
    } else {
        msg = "⚠️ Cần ôn tập thêm! Hãy đọc kỹ lại file markdown `specify_the_contents_of_a_query_axis.md` và các lời giải thích chi tiết bên dưới.";
    }
    document.getElementById("summaryMsg").innerText = msg;

    // Scroll to summary
    summaryCard.scrollIntoView({ behavior: "smooth", block: "center" });
}

function resetQuiz() {
    userAnswers = {};
    isSubmitted = false;
    document.getElementById("scoreDisplay").innerText = "--";
    document.getElementById("answeredCount").innerText = "0";
    document.getElementById("summaryCard").style.display = "none";
    renderQuiz();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

// Initial load
document.addEventListener("DOMContentLoaded", renderQuiz);
</script>
